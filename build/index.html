<!--Boilerplate with Bootstrap ᕙ( ¤ 〰 ¤ )ᕗ-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script type="module" src="https://esm.run/@material/web@1.0.0/all.js"></script>
    <!--The Magic! (ಠ_ಠ)━☆ﾟ.*･｡ﾟ -->
    <title>🎄</title>
    <script type="module" src="./js/main.js"></script>

</head>
<body>
    <!--Message for unsupported browsers (┛✧Д✧))┛彡┻━┻-->
    <noscript>
        <p>
            Your browser does not support the HTML5 Canvas element. <br>
            (╯°□°）╯︵ ┻━┻) <br>
            Please consider updating your browser to enjoy the
            full functionality of this website.
        </p>
    </noscript>

    <div class="fab-container">
        <md-fab id="editFab" variant="branded" aria-label="Edit">
            <md-icon slot="icon">edit</md-icon>
        </md-fab>
    </div>
    <div class="fab-container fab-container--left">
        <a class="fab-link" href="https://andypants.xyz/fireplace" aria-label="Fireplace">
            <md-fab variant="secondary">
                <md-icon slot="icon">park</md-icon>
            </md-fab>
        </a>
    </div>

    <md-dialog id="editDialog">
        <div slot="headline">Customize Display</div>
        <form id="editDialogForm" slot="content">
            <md-outlined-text-field id="displayTextField" label="Display text" maxlength="40"></md-outlined-text-field>
            <label class="control-field">Mode
                <select id="modeSelect">
                    <option value="neon">Neon</option>
                    <option value="vortex">Vortex</option>
                    <option value="glitch">Glitch</option>
                    <option value="pulse">Pulse</option>
                </select>
            </label>
            <div class="color-input-row">
                <label class="color-field">Left
                    <input type="color" value="#ff0000" data-gradient-input />
                </label>
                <label class="color-field">Middle
                    <input type="color" value="#ff00ff" data-gradient-input />
                </label>
                <label class="color-field">Right
                    <input type="color" value="#0000ff" data-gradient-input />
                </label>
                <label class="color-field">Background
                    <input type="color" value="#000000" id="backgroundColorInput" />
                </label>
            </div>
            <div class="control-grid">
                <label class="control-field">Particle Size
                    <input type="range" id="particleGapInput" min="2" max="12" step="1" />
                    <span class="control-value" data-value-for="particleGapInput"></span>
                </label>
                <label class="control-field">Force Radius
                    <input type="range" id="mouseRadiusInput" min="1000" max="60000" step="500" />
                    <span class="control-value" data-value-for="mouseRadiusInput"></span>
                </label>
                <label class="control-field">Friction
                    <input type="range" id="frictionInput" min="0.05" max="0.95" step="0.01" />
                    <span class="control-value" data-value-for="frictionInput"></span>
                </label>
                <label class="control-field">Trail
                    <input type="range" id="trailInput" min="0.05" max="1" step="0.01" />
                    <span class="control-value" data-value-for="trailInput"></span>
                </label>
                <label class="control-field">Gradient Speed
                    <input type="range" id="gradientSpeedInput" min="0" max="0.06" step="0.001" />
                    <span class="control-value" data-value-for="gradientSpeedInput"></span>
                </label>
            </div>
        </form>
        <div slot="actions">
            <md-text-button id="cancelEditButton" type="button">Cancel</md-text-button>
            <md-filled-button type="submit" form="editDialogForm">Save</md-filled-button>
        </div>
    </md-dialog>
</body>
</html>
